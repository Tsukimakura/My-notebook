<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">Stack frames and nested calls (RV64 example)</title><desc id="desc">Stack grows downward toward lower addresses. Each function restores its own frame before returning.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs>
<rect width="1000" height="610" fill="#ffffff"/>
<text x="32" y="38" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#1e293b" text-anchor="start" font-weight="700">Stack frames and nested calls (RV64 example)</text>
<text x="32" y="75" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#64748b" text-anchor="start" font-weight="400">One possible layout; ABI does not require this exact ordering.</text>
<text x="160" y="115" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="400">Higher addresses</text>
<text x="160" y="504" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="400">Lower addresses</text>
<line x1="160" y1="140" x2="160" y2="475" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="160" y="536" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="400">Stack growth</text>
<rect x="240" y="103" width="400" height="75" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="260" y="145" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#1e293b" text-anchor="start" font-weight="400">Older / caller frames</text>
<rect x="240" y="178" width="400" height="116" rx="6" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="260" y="213" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#1e293b" text-anchor="start" font-weight="700">Function f frame</text>
<text x="260" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#1e293b" text-anchor="start" font-weight="400">saved ra / callee-saved registers</text>
<text x="260" y="272" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#1e293b" text-anchor="start" font-weight="400">locals / saved call arguments</text>
<rect x="240" y="294" width="400" height="52" rx="6" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="260" y="327" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#1e293b" text-anchor="start" font-weight="400">g: saved ra at 8(sp)</text>
<rect x="240" y="346" width="400" height="52" rx="6" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="260" y="379" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#1e293b" text-anchor="start" font-weight="400">g: saved s0 at 0(sp)</text>
<rect x="240" y="398" width="400" height="75" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="260" y="440" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#1e293b" text-anchor="start" font-weight="400">Unused space below current sp</text>
<line x1="780" y1="178" x2="647" y2="178" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="785" y="181" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#1e293b" text-anchor="start" font-weight="400">sp before f</text>
<line x1="780" y1="294" x2="647" y2="294" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="785" y="297" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#1e293b" text-anchor="start" font-weight="400">sp before g</text>
<line x1="780" y1="398" x2="647" y2="398" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="785" y="401" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#1e293b" text-anchor="start" font-weight="400">current sp in g</text>
<text x="240" y="529" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#1e293b" text-anchor="start" font-weight="400">g entry:  addi sp, sp, -16</text>
<text x="240" y="561" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#1e293b" text-anchor="start" font-weight="400">g exit:    restore saved state; addi sp, sp, 16; ret</text>
</svg>