<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">valid-ready 背压与传输</title><desc id="desc">E0 E1 背压保持 A，E2 接收 A，E3 E4 连续接收 B C。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#46627b"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#20364d;font-size:19px}.small{font-size:16px}.box{fill:#edf5fc;stroke:#5980a1;stroke-width:2;rx:10}.line{fill:none;stroke:#46627b;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}.label{font-weight:bold}</style><rect width="960" height="340" fill="#fff"/><text x="30" y="35" class="label">valid-ready：采样边沿上的值</text><rect x="220" y="53" width="120" height="230" rx="8" fill="#fff3df"/><rect x="365" y="53" width="120" height="230" rx="8" fill="#fff3df"/><rect x="510" y="53" width="120" height="230" rx="8" fill="#e9f7ee"/><rect x="655" y="53" width="120" height="230" rx="8" fill="#e9f7ee"/><rect x="800" y="53" width="120" height="230" rx="8" fill="#e9f7ee"/><text x="55" y="85" class="label">边沿</text><text text-anchor="middle" x="280" y="85">E0</text><text text-anchor="middle" x="425" y="85">E1</text><text text-anchor="middle" x="570" y="85">E2</text><text text-anchor="middle" x="715" y="85">E3</text><text text-anchor="middle" x="860" y="85">E4</text><text x="55" y="130" class="label">valid</text><text text-anchor="middle" x="280" y="130">1</text><text text-anchor="middle" x="425" y="130">1</text><text text-anchor="middle" x="570" y="130">1</text><text text-anchor="middle" x="715" y="130">1</text><text text-anchor="middle" x="860" y="130">1</text><text x="55" y="175" class="label">ready</text><text text-anchor="middle" x="280" y="175">0</text><text text-anchor="middle" x="425" y="175">0</text><text text-anchor="middle" x="570" y="175">1</text><text text-anchor="middle" x="715" y="175">1</text><text text-anchor="middle" x="860" y="175">1</text><text x="55" y="220" class="label">data</text><text text-anchor="middle" x="280" y="220">A</text><text text-anchor="middle" x="425" y="220">A</text><text text-anchor="middle" x="570" y="220">A</text><text text-anchor="middle" x="715" y="220">B</text><text text-anchor="middle" x="860" y="220">C</text><text x="55" y="265" class="label">传输</text><text text-anchor="middle" x="280" y="265">等待</text><text text-anchor="middle" x="425" y="265">等待</text><text text-anchor="middle" x="570" y="265">A</text><text text-anchor="middle" x="715" y="265">B</text><text text-anchor="middle" x="860" y="265">C</text><text x="45" y="312" class="small">valid=1 且 ready=0：保持 A；在 E2 fire，之后允许换 B。</text></svg>
