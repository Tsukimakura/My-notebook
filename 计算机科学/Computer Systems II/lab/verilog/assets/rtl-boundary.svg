<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc"><title id="title">RTL：寄存器与组合逻辑</title><desc id="desc">寄存器 Q 经过组合逻辑得到下一个寄存器的 D，两组寄存器共享时钟。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#46627b"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#20364d;font-size:19px}.small{font-size:16px}.box{fill:#edf5fc;stroke:#5980a1;stroke-width:2;rx:10}.line{fill:none;stroke:#46627b;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}.label{font-weight:bold}</style><rect width="960" height="320" fill="#fff"/>
<text x="30" y="35" class="label">Register → Combinational logic → Register</text>
<rect class="box" x="65" y="90" width="180" height="110"/><text x="97" y="135">寄存器 / Q</text><text x="98" y="169" class="small">当前周期的状态</text>
<rect class="box" x="355" y="90" width="240" height="110"/><text x="388" y="135">组合逻辑</text><text x="388" y="169" class="small">连续计算 f(Q, input)</text>
<rect class="box" x="705" y="90" width="190" height="110"/><text x="735" y="135">寄存器 / D</text><text x="735" y="169" class="small">在有效边沿采样</text>
<path class="line" d="M245 145 H355"/><path class="line" d="M595 145 H705"/>
<text x="34" y="277" class="label">clk</text><path class="line" d="M95 270 H155 V202"/><path class="line" d="M155 270 H800 V202"/>
<text x="355" y="239" class="small">数据路径要在下次边沿前稳定</text></svg>
