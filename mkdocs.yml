site_name: Tsukimakura's notebook
site_description: 计算机科学、信息安全与基础学科的学习笔记
site_url: !ENV [PUBLIC_ORIGIN, 'https://notes.tsukimakura.com/']
strict: true
repo_url: https://github.com/Tsukimakura/My-notebook
repo_name: Tsukimakura/My-notebook
edit_uri: edit/main/docs/
theme:
  name: material
  custom_dir: overrides
  language: zh
  favicon: assets/brand.svg
  font: false

  icon:
    logo: material/book-open-page-variant-outline

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

  features:
      - navigation.instant # 切换笔记时保留对话和正在进行的请求
      - navigation.instant.progress
      - navigation.top # 返回顶部按钮
      - navigation.sections
      - navigation.indexes
      - navigation.footer
      - search.highlight # 搜索结果高亮显示
      - search.share
      - content.action.edit
      - content.action.view
      - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - assets/vendor/katex/katex.min.js
  - assets/vendor/katex/auto-render.min.js
  - javascripts/notebook-theme.js?v=2
  - javascripts/notebook-selection.js?v=1
  - javascripts/notebook-reader.js?v=4
  - javascripts/katex.js?v=2
  - assets/vendor/markdown-it/markdown-it.min.js
  - assets/vendor/dompurify/purify.min.js
  - javascripts/notebook-ai-models.js?v=1
  - javascripts/notebook-ai-scope.js?v=3
  - javascripts/notebook-ai-store.js?v=5
  - javascripts/notebook-ai-attachments.js?v=1
  - javascripts/notebook-ai-layout.js?v=3
  - javascripts/notebook-ai.js?v=17

extra_css:
  - assets/vendor/katex/katex.min.css
  - stylesheets/notebook-theme.css?v=2
  - stylesheets/notebook-reader.css?v=2
  - stylesheets/notebook-ai.css?v=14

copyright: Copyright © 2025 Tsukimakura

extra:
  generator: false
