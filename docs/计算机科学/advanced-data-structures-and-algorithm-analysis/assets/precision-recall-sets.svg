<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" role="img">
<style>text{font-family:Arial,sans-serif;fill:#172b4d;font-size:16px}.title{font-size:20px;font-weight:bold}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}line,path{stroke:#64748b;stroke-width:2;fill:none}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="25" y="35" class="title">Precision: purity of returned results</text>
<text x="25" y="65" class="">Recall: coverage of all relevant results</text>
<rect x="30" y="90" width="500" height="230" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<ellipse cx="225" cy="205" rx="125" ry="85" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<ellipse cx="345" cy="205" rx="125" ry="85" fill="#fee2e2" fill-opacity="0.65" stroke="#dc2626" stroke-width="2"/>
<text x="112" y="120" class="">Relevant</text>
<text x="350" y="120" class="">Retrieved</text>
<text x="145" y="208" class="">FN</text>
<text x="270" y="208" class="">TP</text>
<text x="395" y="208" class="">FP</text>
<text x="50" y="303" class="">TN</text>
<text x="560" y="155" class="">P = TP / (TP + FP)</text>
<text x="560" y="205" class="">R = TP / (TP + FN)</text>
<text x="560" y="255" class="">Ideal: retrieved = relevant</text>
</svg>
