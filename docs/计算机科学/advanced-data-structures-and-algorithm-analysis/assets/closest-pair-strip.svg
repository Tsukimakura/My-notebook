<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title">
  <title id="title">Closest pair: at most seven later candidates</title>
  <desc>Original vector diagram redrawn from the supplied ADS course material.</desc>
  <rect width="100%" height="100%" fill="white" />
  <style>text{font-family:Arial,sans-serif;fill:#172d4d;font-size:18px} .small{font-size:14px;fill:#53667b} .heading{font-size:22px;font-weight:bold}</style>
  <text x="24" y="32" text-anchor="start" class="heading">Closest pair: at most seven later candidates</text>
  <rect x="50" y="95" width="65" height="65" rx="4" fill="#eaf2ff" stroke="#8795a8" />
  <rect x="115" y="95" width="65" height="65" rx="4" fill="#eaf2ff" stroke="#8795a8" />
  <rect x="180" y="95" width="65" height="65" rx="4" fill="#edf8f1" stroke="#8795a8" />
  <rect x="245" y="95" width="65" height="65" rx="4" fill="#edf8f1" stroke="#8795a8" />
  <rect x="50" y="160" width="65" height="65" rx="4" fill="#eaf2ff" stroke="#8795a8" />
  <rect x="115" y="160" width="65" height="65" rx="4" fill="#eaf2ff" stroke="#8795a8" />
  <rect x="180" y="160" width="65" height="65" rx="4" fill="#edf8f1" stroke="#8795a8" />
  <rect x="245" y="160" width="65" height="65" rx="4" fill="#edf8f1" stroke="#8795a8" />
  <path d="M180,65 L180,250" fill="none" stroke="#3262ac" stroke-width="2" stroke-dasharray="6 5" />
  <circle cx="65" cy="210" r="5" fill="#bf6233" />
  <text x="50" y="276" text-anchor="start" class="">2 delta wide; delta tall</text>
  <text x="350" y="100" text-anchor="start" class="">Split each side into four delta/2 cells.</text>
  <text x="350" y="142" text-anchor="start" class="">Same-side distances are at least delta.</text>
  <text x="350" y="179" text-anchor="start" class="">Cell diagonal = delta / sqrt(2) &lt; delta.</text>
  <text x="350" y="216" text-anchor="start" class="">At most one point per cell on each side.</text>
  <text x="350" y="253" text-anchor="start" class="small">8 cells: current point + at most 7 later points.</text>
  <text x="350" y="290" text-anchor="start" class="">Scan by y; stop once y difference &gt; delta.</text>
</svg>