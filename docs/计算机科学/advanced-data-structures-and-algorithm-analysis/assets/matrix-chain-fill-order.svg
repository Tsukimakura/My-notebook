  <text x="282" y="291" text-anchor="middle" class="">0</text>
  <text x="355" y="94" text-anchor="start" class="">Cell (i,j): matrices i through j.</text>
  <text x="355" y="132" text-anchor="start" class="">Diagonal: m[i,i] = 0.</text>
  <text x="355" y="170" text-anchor="start" class="">Fill length = 2, 3, ..., n.</text>
  <text x="355" y="208" text-anchor="start" class="">Try every split k in [i, j).</text>
  <text x="355" y="246" text-anchor="start" class="">Read m[i,k] and m[k+1,j].</text>
  <text x="355" y="284" text-anchor="start" class="">Save the winning split for reconstruction.</text>
  <text x="45" y="346" text-anchor="start" class="">O(n^2) intervals x O(n) splits = O(n^3) time; O(n^2) storage.</text>
