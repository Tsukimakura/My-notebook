<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc"><title id="title">Load-use hazard: one stall despite forwarding</title><desc id="desc">Load advances to MEM while the dependent instruction waits in ID. A bubble enters EX, and load data is forwarded in the next cycle.</desc>
